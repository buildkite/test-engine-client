# The canonical repository owns full CLI CI. Keep this status check for
# compatibility PRs without invoking the old uploads or release producer.
steps:
  - label: ":go: Verify the legacy Go entrypoint"
    plugins:
      - docker#v5.13.0:
          image: golang:1.27.3-bookworm
          command:
            - bash
            - -euc
            - |
              export GOWORK=off
              test "$$(go list -m)" = github.com/buildkite/test-engine-client/v3
              go test -mod=readonly .
              export GOBIN="$$(mktemp -d)"
              go install -mod=readonly .
              "$$GOBIN/test-engine-client" --version
