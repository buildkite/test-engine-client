agents:
  queue: oss-deploy

steps:
  - label: ":mag: Verify retained v3.6.0 and Files artifacts"
    key: verify-v360
    timeout_in_minutes: 15
    command: .buildkite/steps/v360-private-stage.sh verify
    artifact_paths:
      - dist/buildkite-packages/*
      - dist/verified-manifest.json
      - dist/verified-stage.sha256
